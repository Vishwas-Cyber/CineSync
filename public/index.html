<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CineSync — Discover. Compare. Remember. Watch.</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1 class="brand">Cine<span>Sync</span></h1>
      <p class="tagline">Discover. Compare. Remember. Watch.</p>

      <ul class="nav nav-pills mb-3 justify-content-center">
        <li class="nav-item"><button class="nav-link active" data-auth="login">Login</button></li>
        <li class="nav-item"><button class="nav-link" data-auth="register">Register</button></li>
      </ul>

      <form id="authForm">
        <div class="mb-3 d-none" id="nameBox">
          <input class="form-control" id="name" placeholder="Full name" required>
        </div>
        <div class="mb-3">
          <input class="form-control" id="email" type="email" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <input class="form-control" id="password" type="password" placeholder="Password" required>
        </div>
        <button class="btn btn-purple w-100" id="authSubmit">Login</button>
      </form>

      <div class="demo-box mt-3">
        <small>Admin: admin@cinesync.com / admin123</small><br>
        <small>User: vishwas@cinesync.com / user123</small>
      </div>
    </div>
  </div>

  <div id="appScreen" class="d-none">
    <aside class="sidebar">
      <h2 class="brand small-brand">Cine<span>Sync</span></h2>
      <nav>
        <button class="side-link active" data-view="home"><i class="bi bi-house"></i> Home</button>
        <button class="side-link" data-view="movies"><i class="bi bi-film"></i> Movies</button>
        <button class="side-link" data-view="artists"><i class="bi bi-people"></i> Artists</button>
        <button class="side-link" data-view="music"><i class="bi bi-music-note"></i> Music</button>
        <button class="side-link" data-view="memory"><i class="bi bi-search"></i> Memory Search</button>
        <button class="side-link" data-view="library"><i class="bi bi-collection"></i> My Library</button>
        <button class="side-link" data-view="calendar"><i class="bi bi-calendar-event"></i> Watch Calendar</button>
        <button class="side-link admin-only d-none" data-view="admin"><i class="bi bi-speedometer2"></i> Admin</button>
      </nav>
      <button id="logoutBtn" class="btn btn-outline-danger mt-auto"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h4 id="pageTitle">Entertainment Dashboard</h4>
          <p class="text-secondary mb-0">Your connected movie and music experience</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button id="notifBtn" class="btn btn-dark position-relative">
            <i class="bi bi-bell"></i>
            <span id="notifDot" class="notif-dot d-none"></span>
          </button>
          <span id="userChip" class="user-chip"></span>
        </div>
      </header>

      <section id="view"></section>
    </main>
  </div>

  <div id="toast" class="toast-box"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
